name: Private v0.3 baseline
on:
  push:
    branches: ['feat/team-cooldowns-v03']
    paths: ['.github/workflows/v03-context.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2faa82331ee5bbb5011dc4312bbc5dbed485a662
          persist-credentials: false
      - run: git archive --format=tar HEAD > baseline.tar
      - uses: actions/upload-artifact@v4
        with:
          name: private-v03-baseline
          path: baseline.tar
          retention-days: 1
