name: Browser and exploration regression
on:
  pull_request:
    paths: ['src/**', 'style.css', 'compact.css', 'index.html', 'scripts/build.mjs', 'tests/**', '.github/workflows/visual-regression.yml']
  push:
    branches: [main]
    paths: ['src/**', 'style.css', 'compact.css', 'index.html', 'scripts/build.mjs', 'tests/**', '.github/workflows/visual-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - name: Check actual pixels, wall occlusion, motion and mobile UI
        shell: bash
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/render_browser.py
          python tests/battle_browser.py
          python tests/browser_smoke.py
          python tests/compact_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploration-pixel-results
          path: test-results/
          retention-days: 7
