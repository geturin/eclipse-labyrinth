name: Apply verified team-turn v0.3
on:
  push:
    branches: ['feat/team-cooldowns-v03']
    paths: ['.github/v03-delta-*.txt', '.github/workflows/v03-apply.yml']
permissions:
  contents: write
concurrency:
  group: team-turn-v03-staging
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'geturin/eclipse-labyrinth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the exact baseline and tested source delta
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, subprocess
          paths = 'AGENTS.md CHANGELOG.md README.md docs/GAME_DESIGN.md docs/V03.md docs/v03-qa.json package.json scripts/balance.mjs src/app.js src/data.js src/engine.js src/world.js style.css tests/battle_browser.py tests/browser_smoke.py tests/engine.test.mjs tests/render_browser.py tests/rendering.test.mjs tests/tactical.test.mjs'.split()
          tmp = Path(os.environ['RUNNER_TEMP'])
          baseline = {p:Path(p).read_text(encoding='utf-8') if Path(p).exists() else '' for p in sorted(paths)}
          raw = json.dumps(baseline,ensure_ascii=False,separators=(',',':'),sort_keys=True).encode('utf-8')
          assert hashlib.sha256(raw).hexdigest() == '8f398ff17911d69889e65464911106e728f4187f0883a5ed52143771b014d7cc', 'Baseline changed; stop without overwriting'
          (tmp/'v03-dict.json').write_bytes(raw)
          encoded = ''.join(Path(f'.github/v03-delta-{i}.txt').read_text().strip() for i in range(3))
          delta = base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(delta).hexdigest() == '125ea4f34fe5b624e1d869d2d0a72f5d2d26a651dab48d6fea6f548403971573'
          (tmp/'v03-delta.zst').write_bytes(delta)
          subprocess.run(['zstd','-df',f'--patch-from={tmp}/v03-dict.json',str(tmp/'v03-delta.zst'),'-o',str(tmp/'v03-target.json')],check=True)
          raw = (tmp/'v03-target.json').read_bytes()
          assert len(raw) < 2000000
          assert hashlib.sha256(raw).hexdigest() == 'af6bc92ff8dbd9d616d955cd9820a7372fa5c95a1d647945ef32f5f7d57174a9'
          files = json.loads(raw)
          assert sorted(files) == sorted(paths)
          for name,text in files.items():
              p = Path(name)
              assert not p.is_symlink() and isinstance(text,str)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text,encoding='utf-8')
          (tmp/'v03-paths.json').write_text(json.dumps(paths+['dist/index.html']))
          print('Exact baseline, transport checksum, and tested source snapshot verified.')
          PY
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
      - name: Commit tested source and matching offline HTML together
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          test "$(git hash-object dist/index.html)" = '408f559fb9c003b0a5850b970d9f634afdd7bef3'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          paths = json.loads((Path(os.environ['RUNNER_TEMP'])/'v03-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git commit -m 'feat: team cooldown turns, alarm patrols, field tools and compiled v0.3'
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:$TARGET_BRANCH"
