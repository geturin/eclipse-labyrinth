name: Stage and verify tactical v0.2
on:
  push:
    branches: [feat/tactical-depth-v02]
    paths: [.github/workflows/v02-bootstrap.yml, .github/v02-source.json.gz]
permissions:
  contents: write
concurrency:
  group: tactical-v02-staging
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'geturin/eclipse-labyrinth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified source snapshot, when present
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';
          const archive='.github/v02-source.json.gz';
          if (!fs.existsSync(archive)) { console.log('Staging workflow ready; awaiting source snapshot.'); process.exit(0); }
          const files=JSON.parse(zlib.gunzipSync(fs.readFileSync(archive)).toString('utf8'));
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          for (const f of files) {
            if (!/^(src\/|scripts\/|tests\/|docs\/|README\.md$|AGENTS\.md$|CHANGELOG\.md$|package\.json$|index\.html$|style\.css$)/.test(f.path) || f.path.includes('..') || path.isAbsolute(f.path)) throw Error('Unsafe snapshot path: '+f.path);
            const current=fs.existsSync(f.path)?digest(fs.readFileSync(f.path)):null;
            if (current!==f.before) throw Error('Base changed; refusing overwrite: '+f.path);
            if (digest(f.content)!==f.after) throw Error('Snapshot checksum mismatch: '+f.path);
          }
          for (const f of files) { fs.mkdirSync(path.dirname(f.path),{recursive:true}); fs.writeFileSync(f.path,f.content); }
          fs.unlinkSync(archive);
          console.log('Applied '+files.length+' verified source files.');
          JS
      - run: npm test
      - run: npm run build
      - name: Commit source and offline page together
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: tactical v0.2 rules, tests and compiled offline game'
          git push origin "HEAD:$GITHUB_REF_NAME"
