name: Stage and verify tactical v0.2
on:
  push:
    branches: [feat/tactical-depth-v02]
    paths: ['.github/workflows/v02-bootstrap.yml', '.github/v02-source.*']
permissions:
  contents: write
concurrency:
  group: tactical-v02-staging
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'geturin/eclipse-labyrinth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checksum-verified source snapshot, when present
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import zlib from 'node:zlib';
          const archives=[0,1,2,3].map(i=>`.github/v02-source.part${i}.br`);
          const found=archives.filter(p=>fs.existsSync(p));
          if (!found.length) { console.log('Staging workflow ready; no pending source snapshot.'); process.exit(0); }
          if (found.length!==archives.length) throw Error('Incomplete source snapshot.');
          const files=JSON.parse(zlib.brotliDecompressSync(Buffer.concat(archives.map(p=>fs.readFileSync(p)))).toString('utf8'));
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          const prepared=[];
          const seen=new Set();
          for (const f of files) {
            if (!/^(src\/|scripts\/|tests\/|docs\/|README\.md$|AGENTS\.md$|CHANGELOG\.md$|package\.json$|index\.html$|style\.css$)/.test(f.path) || f.path.includes('..') || path.isAbsolute(f.path) || seen.has(f.path)) throw Error('Unsafe snapshot path: '+f.path);
            seen.add(f.path);
            const exists=fs.existsSync(f.path);
            const old=exists?fs.readFileSync(f.path):Buffer.alloc(0);
            if ((exists?digest(old):null)!==f.before) throw Error('Base changed; refusing overwrite: '+f.path);
            const content=Buffer.concat(f.parts.map(part=>{
              if (typeof part==='string') return Buffer.from(part,'utf8');
              if (!Array.isArray(part) || part.length!==2 || !part.every(Number.isInteger) || part[0]<0 || part[1]<part[0] || part[1]>old.length) throw Error('Invalid source slice: '+f.path);
              return old.subarray(part[0],part[1]);
            }));
            if (digest(content)!==f.after) throw Error('Snapshot checksum mismatch: '+f.path);
            prepared.push({path:f.path,content});
          }
          for (const f of prepared) { fs.mkdirSync(path.dirname(f.path),{recursive:true}); fs.writeFileSync(f.path,f.content); }
          for (const archive of archives) fs.unlinkSync(archive);
          console.log('Applied '+prepared.length+' verified source files.');
          JS
      - run: npm test
      - run: npm run build
      - name: Commit source and offline page together
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: tactical v0.2 rules, tests and compiled offline game'
          git push origin "HEAD:$GITHUB_REF_NAME"
