name: Localization baseline
on:
  push:
    branches: ['feat/english-localization-v033']
    paths: ['.github/workflows/i18n-baseline.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b22124def75a4ed87fa32b7e28ff7422905bfae
          fetch-depth: 0
      - name: Archive source and history without repository credentials
        run: |
          mkdir -p /tmp/i18n-baseline
          git archive --format=zip HEAD -o /tmp/i18n-baseline/source.zip
          git bundle create /tmp/i18n-baseline/history.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: i18n-baseline
          path: /tmp/i18n-baseline/
          retention-days: 1
